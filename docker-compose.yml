services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: scalelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scalelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scalelink_secret}
      POSTGRES_DB: ${POSTGRES_DB:-scalelink}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scalelink} -d ${POSTGRES_DB:-scalelink}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - scalelink-net

  # ── Redis Cache & Streams ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: scalelink-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - scalelink-net

  # ── API Backend ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scalelink-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_ADDR=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080" # Direct access for debugging / internal testing
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks:
      - scalelink-net

  # ── Async Click Worker (Phase 3) ──────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scalelink-worker
    command: ["/worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_ADDR=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scalelink-net

  # ── Nginx Reverse Proxy / Load Balancer ───────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: scalelink-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - scalelink-net

networks:
  scalelink-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
