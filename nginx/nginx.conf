worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured log format — JSON for easy parsing
    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referrer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"upstream":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_time":"$request_time"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;
    gzip           on;
    gzip_types     text/plain application/json application/javascript text/css;

    # ── Upstream: API backend ─────────────────────────────────────────────────
    # Phase 1: single instance. Phase 5: 3 instances with least_conn.
    upstream api_backend {
        least_conn;
        server api:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Content-Type-Options  nosniff always;
        add_header X-Frame-Options         DENY    always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        client_max_body_size 1m;

        # ── Frontend static files (served from /usr/share/nginx/html) ────────
        root /usr/share/nginx/html;
        index index.html;

        # ── Health check (bypass to backend) ─────────────────────────────────
        location = /health {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # ── Metrics (internal only in production; open for phase 1) ──────────
        location = /metrics {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── API routes → backend ──────────────────────────────────────────────
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
            proxy_connect_timeout 5s;

            # Expose rate-limit and cache headers to browser
            add_header X-Cache        $upstream_http_x_cache        always;
            add_header X-Served-By    $upstream_http_x_served_by    always;
        }

        # ── Short-link redirects → backend ───────────────────────────────────
        # Match single-segment paths that are not static assets.
        # Codes are Base62: [A-Za-z0-9_-]
        location ~ ^/([A-Za-z0-9_-]{3,20})$ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout  5s;

            # Propagate cache header from backend
            add_header X-Cache     $upstream_http_x_cache     always;
            add_header X-Served-By $upstream_http_x_served_by always;
        }

        # ── SPA fallback (React Router) ───────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Static asset caching ──────────────────────────────────────────────
        location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
