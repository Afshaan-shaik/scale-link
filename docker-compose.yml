x-api-common: &api-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  environment:
    - POSTGRES_HOST=postgres
    - REDIS_ADDR=redis:6379
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s
  networks:
    - scalelink-net

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: scalelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scalelink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scalelink_secret}
      POSTGRES_DB: ${POSTGRES_DB:-scalelink}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scalelink} -d ${POSTGRES_DB:-scalelink}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - scalelink-net

  # ── Redis Cache & Streams ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: scalelink-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - scalelink-net

  # ── API Backend Cluster (Phase 5: 3 Load-Balanced Instances) ──────────────────
  api1:
    <<: *api-common
    container_name: scalelink-api-1
    ports:
      - "8081:8080"

  api2:
    <<: *api-common
    container_name: scalelink-api-2
    ports:
      - "8082:8080"

  api3:
    <<: *api-common
    container_name: scalelink-api-3
    ports:
      - "8083:8080"

  # ── Async Click Worker (Phase 3) ──────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scalelink-worker
    command: ["/worker"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_ADDR=redis:6379
      - WORKER_METRICS_PORT=8082
    ports:
      - "8084:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scalelink-net

  # ── Nginx Reverse Proxy / Load Balancer ───────────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: scalelink-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
    networks:
      - scalelink-net

  # ── Prometheus Observability (Phase 5) ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: scalelink-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - scalelink-net

  # ── Grafana Dashboard Suite (Phase 5) ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: scalelink-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - scalelink-net

  # ── k6 Load Testing Tooling (Phase 5) ─────────────────────────────────────────
  k6:
    image: grafana/k6:0.50.0
    container_name: scalelink-k6
    profiles: ["tools"]
    volumes:
      - ./loadtest:/loadtest:ro
    environment:
      - BASE_URL=http://nginx:80
    networks:
      - scalelink-net

networks:
  scalelink-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
